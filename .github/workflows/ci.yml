name: CI

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: {}
  push:
    branches:
      - master
      - beta
      - private-preview
      - sdk-release/**
      - feature/**
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:
    branches:
      - master
      - beta
      - private-preview
      - sdk-release/**
      - feature/**

permissions: {}

jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer

    runs-on: "ubuntu-24.04"

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/php-cs-fixer

  phpstan:
    name: PHPStan

    runs-on: "ubuntu-24.04"

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/phpstan

  tests:
    name: Tests (php@${{ matrix.php-version }}, AUTOLOAD=${{ matrix.autoload }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the tests matrix in canary.yml.
        os:
          - "ubuntu-24.04"
        autoload:
          - "0"
          - "1"
        php-version:
          # https://docs.stripe.com/sdks/versioning?lang=php
          # https://endoflife.date/php
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        include:
          - os: windows-latest
            # use any modern-ish version
            php-version: "8.5"
            autoload: "1"
          - os: windows-latest
            # use any modern-ish version
            php-version: "8.5"
            autoload: "0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/test
        with:
          php-version: ${{ matrix.php-version }}
          autoload: ${{ matrix.autoload }}

  publish:
    # Doesn't actually publish. The publish happens via a packagist webhook configured in the Github UI. But we still display a message here
    name: Publish
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stripe/openapi/actions/notify-release@master
        if: always()
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
