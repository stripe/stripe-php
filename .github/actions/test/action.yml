name: Tests
description: Start stripe-mock, then run the test suite. Shared by CI and Canary CI; expects the repository to be checked out.

inputs:
  php-version:
    description: PHP version to test against.
    required: true
  autoload:
    description: Whether to run the tests with Composer autoloading ("1") or without ("0").
    required: true
  canary_channel:
    description: >-
      Canary channel (ga, beta, or private-preview) whose specs and fixtures
      stripe-mock should serve. Empty uses the OPENAPI_VERSION release.
    required: false
    default: ''

# Steps that ran under the runner's default shell before these were shared are
# split by OS so Windows keeps running them in PowerShell.
runs:
  using: composite
  steps:
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Resolve stripe-mock OpenAPI inputs
      id: openapi
      shell: bash
      env:
        CANARY_CHANNEL: ${{ inputs.canary_channel }}
      run: |
        set -euo pipefail

        if [[ -z "$CANARY_CHANNEL" ]]; then
          echo "version=$(< OPENAPI_VERSION)" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        case "$CANARY_CHANNEL" in
          ga)
            spec_name=spec3.sdk.json
            fixtures_name=fixtures3.json
            beta=false
            ;;
          beta)
            spec_name=spec3.beta.sdk.json
            fixtures_name=fixtures3.beta.json
            beta=true
            ;;
          private-preview)
            spec_name=spec3.private_preview.sdk.json
            fixtures_name=fixtures3.private_preview.json
            beta=true
            ;;
          *)
            echo "::error::Unsupported canary channel: $CANARY_CHANNEL"
            exit 1
            ;;
        esac

        canary_dir="$GITHUB_WORKSPACE/.stripe-mock-canary"
        mkdir -p "$canary_dir"

        spec_path="$canary_dir/$spec_name"
        fixtures_path="$canary_dir/$fixtures_name"
        canary_base="https://raw.githubusercontent.com/stripe/openapi/master/openapi/canary/$CANARY_CHANNEL"
        curl_options=(
          --retry 3
          --retry-all-errors
          --fail
          --silent
          --show-error
        )

        curl "${curl_options[@]}" "$canary_base/$spec_name" -o "$spec_path"
        curl "${curl_options[@]}" "$canary_base/$fixtures_name" -o "$fixtures_path"

        {
          echo "spec_path=$spec_path"
          echo "fixtures_path=$fixtures_path"
          echo "beta=$beta"
        } >> "$GITHUB_OUTPUT"

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ inputs.php-version }}

    # We run php-cs-fixer and PHPStan in separate jobs, but the versions we use are not compatible
    # with all the versions of PHP that we want to execute PHPUnit upon
    - name: Trim dependency
      if: runner.os != 'Windows'
      shell: bash
      run: composer remove --dev --no-update friendsofphp/php-cs-fixer phpstan/phpstan
    - name: Trim dependency
      if: runner.os == 'Windows'
      shell: pwsh
      run: composer remove --dev --no-update friendsofphp/php-cs-fixer phpstan/phpstan

    - name: Validate composer.json
      if: runner.os != 'Windows'
      shell: bash
      run: composer validate
    - name: Validate composer.json
      if: runner.os == 'Windows'
      shell: pwsh
      run: composer validate

    - name: Install dependencies
      if: runner.os != 'Windows'
      shell: bash
      run: composer install --prefer-dist --no-progress
    - name: Install dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: composer install --prefer-dist --no-progress

    - uses: stripe/openapi/actions/stripe-mock@master
      with:
        openapi_version: ${{ steps.openapi.outputs.version }}
        spec_path: ${{ steps.openapi.outputs.spec_path }}
        fixtures: ${{ steps.openapi.outputs.fixtures_path }}
        beta: ${{ steps.openapi.outputs.beta }}

    # --yes skips the confirmation dialogue for the CI test, which modifies files
    - name: Run test suite
      if: runner.os != 'Windows'
      shell: bash
      env:
        AUTOLOAD: ${{ inputs.autoload }}
      run: |
        php --version
        just --yes ci-test "$AUTOLOAD"
    - name: Run test suite
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        AUTOLOAD: ${{ inputs.autoload }}
      run: |
        php --version
        just --yes ci-test $env:AUTOLOAD
